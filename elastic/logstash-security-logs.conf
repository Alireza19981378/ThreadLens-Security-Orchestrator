input {
  file {
    id => "threadlens-app-log"
    path => "/Users/arash/Documents/pro/security_orchestrator/backend/var/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/threadlens-app-log.sincedb"
    codec => json
  }
}

filter {
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "service.name" => "threadlens"
      "event.dataset" => "threadlens.backend"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    index => "security-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
