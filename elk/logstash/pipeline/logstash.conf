input {
  file {
    id => "threadlens-django-app-log"
    path => "/usr/share/logstash/pipeline/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/threadlens-app-log.sincedb"
    codec => json
  }
}

filter {
  if [asctime] {
    date {
      match => ["asctime", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
      timezone => "UTC"
    }
  } else if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  if [metadata][status_code] {
    mutate { copy => { "[metadata][status_code]" => "status_code" } }
  }

  if [metadata][request] {
    mutate { copy => { "[metadata][request]" => "request" } }
  }

  if ![scanner_name] and [metadata][scanner][name] {
    mutate { copy => { "[metadata][scanner][name]" => "scanner_name" } }
  }

  if [metadata][execution][status] {
    mutate { copy => { "[metadata][execution][status]" => "execution_status" } }
  }

  if [metadata][execution][duration_ms] {
    mutate { copy => { "[metadata][execution][duration_ms]" => "duration_ms" } }
  }

  mutate {
    add_field => {
      "[service][name]" => "threadlens"
      "[event][dataset]" => "threadlens.django"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "threadlens-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
